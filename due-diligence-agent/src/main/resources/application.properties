fema.nfhl.firm-panel-layer=${FEMA_NFHL_FIRM_PANEL_LAYER:}
shovels.base-url=${SHOVELS_BASE_URL:}
shovels.api-key=${SHOVELS_API_KEY:}
shovels.permit-from=${SHOVELS_PERMIT_FROM:}
shovels.permit-to=${SHOVELS_PERMIT_TO:}
epa.envirofacts.base-url=${EPA_ENVIROFACTS_BASE_URL:}
epa.envirofacts.endpoint=${EPA_ENVIROFACTS_ENDPOINT:frs}
attom.base-url=${ATTOM_BASE_URL:}
